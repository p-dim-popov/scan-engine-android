name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the CMake and Ninja versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      # Configuring fails when ENGINE_BACKENDS names a backend outside
      # licensing/backend-allowlist.txt.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Host tests (test backend scans, Page stream, guard self-tests)
        run: ctest --test-dir build --output-on-failure

      - name: SANE exception guard (compiled sane-backends files)
        run: scripts/check-sane-exception.sh build third_party/sane-backends licensing/sane-exception-exemptions.txt

      - name: Licence notice guard (Engine sources)
        run: scripts/check-licence-notices.sh
