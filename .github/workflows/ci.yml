name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the CMake and Ninja versions pinned in mise.toml. Each step below
      # is a mise task from mise.toml; `mise run ci` runs the same steps locally.
      - uses: jdx/mise-action@v5

      # Configuring fails when ENGINE_BACKENDS names a backend outside
      # licensing/backend-allowlist.txt.
      - name: Configure
        run: mise run configure

      - name: Build
        run: mise run build

      - name: Host tests (test backend scans, Page stream, guard self-tests)
        run: mise run test

      - name: Licence guards (compiled sane-backends files, Engine sources)
        run: mise run guards
