# Host build tools. The Android build uses the SDK's CMake through Gradle.
# shellcheck and actionlint check the scripts and the CI workflow.
[tools]
cmake = "4.4.4"
ninja = "1.13.2"
shellcheck = "0.11.0"
actionlint = "1.7.12"

# `mise tasks` lists these; `mise run <name>` runs one with the tools above on the PATH.
# Each mise task runs the ones it needs first, so any of them can run on its own.

[tasks.configure]
description = "Configure the host build in build/; fails on a backend outside the allow-list"
run = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"

[tasks.build]
description = "Build the Engine and its host tests"
depends = ["configure"]
run = "cmake --build build"

[tasks.test]
description = "Run the host tests (test backend scans, Page stream, guard self-tests)"
depends = ["build"]
run = "ctest --test-dir build --output-on-failure"

[tasks.guards]
description = "Run the licence guards: SANE exception in compiled sane-backends files, notices in Engine sources"
depends = ["build"]
run = [
    "scripts/check-sane-exception.sh build third_party/sane-backends licensing/sane-exception-exemptions.txt",
    "scripts/check-licence-notices.sh",
]

[tasks.lint]
description = "Run shellcheck on the scripts and actionlint on the CI workflow; any finding fails"
run = ["shellcheck scripts/*.sh", "actionlint"]

# The steps of .github/workflows/ci.yml, in the same order.
[tasks.ci]
description = "Run every CI step in order: lint, configure, build, test, guards"
run = [{ task = "lint" }, { task = "configure" }, { task = "build" }, { task = "test" }, { task = "guards" }]
